name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies and build
        run: |
          cd client
          npm install
          npm run build
          cd ..

      - name: Create .env file
        run: |
          cat > .env <<EOF
          MONGO_URI=mongodb://localhost:27017/job-poster
          SESSION_SECRET=ci-test-secret
          PORT=3000
          OWNER_EMAIL=ci-owner@test.local
          OWNER_PASSWORD=password123
          EOF

      - name: Seed owner account
        run: node scripts/seed-owner.js

      - name: Start server
        run: npm start &
        env:
          MONGO_URI: mongodb://localhost:27017/job-poster
          SESSION_SECRET: ci-test-secret
          PORT: 3000
          OWNER_EMAIL: ci-owner@test.local
          OWNER_PASSWORD: password123

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/auth/me > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run E2E tests
        run: node scripts/test-e2e.js
        env:
          OWNER_EMAIL: ci-owner@test.local
          OWNER_PASSWORD: password123
          MONGO_URI: mongodb://localhost:27017/job-poster

      - name: Cleanup server process
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true
