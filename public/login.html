<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Job Poster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <main class="login-container">
      <div class="form-card">
        <div class="brand" style="justify-content: center; margin-bottom: 24px;">
          <img src="img/logo.svg" alt="Job Poster" class="brand-logo">
          <div class="brand-text">
            <div class="brand-name">Job Poster</div>
          </div>
        </div>
        
        <h2 style="text-align: center; margin-top: 0; margin-bottom: 16px;">Enter Password</h2>
        <p class="hint" style="text-align: center; margin-bottom: 24px;">Sign in to access the app</p>
        
        <form id="login-form">
          <label>
            Password
            <input type="password" id="password" required placeholder="Enter your password" autofocus>
          </label>
          <div id="error-message" class="status-pill danger" style="display: none; margin-bottom: 16px; text-align: center;"></div>
          <div class="form-actions" style="justify-content: center;">
            <button type="submit" class="btn-primary" style="min-width: 160px;">Sign In</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
  </style>

  <script>
    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = passwordInput.value;
      errorMessage.style.display = 'none';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        if (!response.ok) {
          const data = await response.json().catch(() => ({ error: 'Login failed' }));
          errorMessage.textContent = data.error || 'Invalid password';
          errorMessage.style.display = 'block';
          passwordInput.value = '';
          return;
        }
        
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMessage.textContent = 'Something went wrong. Please try again.';
        errorMessage.style.display = 'block';
        console.error(err);
      }
    });
  </script>
</body>
</html>
