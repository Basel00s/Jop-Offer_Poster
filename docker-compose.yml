services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/job-poster
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped
volumes:
  mongo-data:
